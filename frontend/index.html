<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Search Assistant</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header area -->
        <header>
            <h1>AI Voice Assistant</h1>
            <p class="subtitle">Ask anything, just by speaking.</p>
        </header>

        <!-- Main interactive area -->
        <main>
            <!-- Microphone button -->
            <div class="mic-container">
                <button id="mic-btn" class="mic-btn">
                    <!-- SVG Microphone Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="22"></line>
                    </svg>
                </button>
                <!-- Status indicator (e.g., "Click mic to speak") -->
                <p id="status-text" class="status-text">Click mic to speak</p>
            </div>

            <!-- Display area for the conversation -->
            <div class="conversation-area">
                <!-- User's question -->
                <div class="message user-message hidden" id="user-message-container">
                    <span class="label">You</span>
                    <p id="question-text">...</p>
                </div>

                <!-- AI's answer -->
                <div class="message ai-message hidden" id="ai-message-container">
                    <span class="label">AI</span>
                    <p id="answer-text">...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Link to our JavaScript logic -->
    <script src="script.js"></script>
</body>
</html>
